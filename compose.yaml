name: reins

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reins}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reins_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-reins}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reins_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-reins} -d ${POSTGRES_DB:-reins}
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles:
      - test
    environment:
      POSTGRES_USER: reins
      POSTGRES_PASSWORD: reins_test_only
      POSTGRES_DB: reins_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U reins -d reins_test
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reins_postgres_data:
